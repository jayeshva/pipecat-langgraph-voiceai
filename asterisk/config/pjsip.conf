; --- IntelliForm AI Voice Assistant pjsip.conf ---
[global]
type=global
user_agent=IntelliForm-Asterisk-PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[intelliform-agent-endpoint](!)
type=endpoint
context=from-intelliform-agent
disallow=all
allow=ulaw,alaw,g722,opus
direct_media=no

; Softphone Extension 1001
[1001](intelliform-agent-endpoint)
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
password=intelliform_secret_pass
username=1001

[1001]
type=aor
max_contacts=2
