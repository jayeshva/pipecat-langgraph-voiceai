; --- IntelliForm AI Voice Assistant extensions.conf ---
[general]
static=yes
writeprotect=no

[from-intelliform-agent]
; Dial Extension 100 to connect to IntelliForm AI Voice Agent over AudioSocket / WebSocket
exten => 100,1,Answer()
 same => n,NoOp(Connecting call to IntelliForm AI Voice Agent...)
 same => n,AudioSocket(12345678-1234-1234-1234-123456789012, 127.0.0.1:8080)
 ; Alternative WebSocket Stream:
 ; same => n,EAGI(ws://host.docker.internal:8080/api/v1/asterisk/ws?agent_id=welcome)
 same => n,Hangup()
